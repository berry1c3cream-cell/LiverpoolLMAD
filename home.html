<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liverpool UI</title>
<link rel="stylesheet" href="estiloLiverpool.css">
</head>

<body>

<!-- TOPBAR -->
<header class="topbar">
    <div>
        <span>Mi tienda</span>
    </div>

    <div>
        <div>Otros servicios | Mesa de regalos | Mi crédito</div>
    </div>
</header>

<!-- HEADER PRINCIPAL -->
<nav class="header">

    <div class="logo">Liverpool</div>

    <div class="btn-cat">
        ☰ Categorías
    </div>

    <div class="search">
        <input type="text" placeholder="Buscar productos...">
    </div>

    <div class="right">
        <span>Mi cuenta</span>
        <span>♡</span>
        <span>🛍</span>
        <span>👁</span>
    </div>

</nav>

<!-- BANNER -->
<section class="banner">
    <div>
        <small>LA ESPERA TERMINÓ</small>
        <h2>Preventa Álbum Panini</h2>
        <button>Comprar ahora</button>
    </div>
</section>

<!-- CONTENIDO -->
<main class="container">

    <h3>Hola, usuario!</h3>

    <div class="continue-card">
        <img src="imagenes/producto_labiales.png" width="40">
        <span>Sigue comprando</span>
    </div>

    <h3>Últimas ofertas</h3>

    <div class="carousel-wrapper">

        <button class="arrow">›</button>

        <div class="carousel">

            <div class="product">
                <img src="imagenes/procuto_toallas.png">
            </div>

            <div class="product">
                <img src="imagenes/producto_aceiteOjos.png">
            </div>

            <div class="product">
                <img src="imagenes/producto_labiales.png">
            </div>

            <div class="product">
                <img src="imagenes/producto_mascara.png">
            </div>

            <div class="product">
                <img src="imagenes/producto_plancha.png">
            </div>

            <div class="product">
                <img src="imagenes/producto_sombras.png">
            </div>

        </div>
    </div>

</main>

</body>
</html>
