<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liverpool UI</title>
<link rel="stylesheet" href="estiloLiverpool.css">
</head>
<body>

<header class="topbar">
    <div class="top-left">
        <span>Mi tienda</span>
    </div>

    <div class="top-right">
        <span>Otros servicios</span>
        <span>Mesa de regalos</span>
        <span>Mi crédito</span>
    </div>
</header>

<nav class="navbar">
    <div class="logo">Liverpool</div>

    <div class="search">
        <span class="categories">Categorías ></span>
        <input type="text" placeholder="Search">
        <span class="help">?</span>
    </div>

    <div class="icons">
        <span>Mi cuenta</span>
        <span>♡</span>
        <span>🛍</span>
        <span>👁</span>
    </div>
</nav>

<section class="banner">
    <div class="banner-text">
        <small>LA ESPERA TERMINÓ</small>
        <h2>Preventa Álbum Panini</h2>
        <button>Comprar ahora</button>
    </div>
</section>

<main class="container">

    <h3>Hola, usuario!</h3>

    <div class="continue-card">
        <img src="imagenes/producto_labiales.png">
        <span>Sigue comprando</span>
    </div>

    <h3>Últimas ofertas</h3>

    <div class="carousel">
    <div class="product">
        <img src="imagenes/procuto_toallas.png">
    </div>

    <div class="product">
        <img src="imagenes/producto_aceiteOjos.png">
    </div>

    <div class="product">
        <img src="imagenes/producto_labiales.png">
    </div>

    <div class="product">
        <img src="imagenes/producto_mascara.png">
    </div>

    <div class="product">
        <img src="imagenes/producto_plancha.png">
    </div>

    <div class="product">
        <img src="imagenes/producto_sombras.png">
    </div>
</div>

</main>

</body>
</html>
