<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liverpool - Datos Personales</title>
    <link rel="stylesheet" href="estiloLiverpool.css">
    <link rel="stylesheet" href="css/datosPersonales.css">
    
</head>
<body class="login-page">

    <!-- TOPBAR -->
    <div class="topbar-mini">
        <span>Envíos gratis en compras mayores a $999</span>
        <span style="cursor: pointer;">Ayuda</span>
    </div>

    <!-- HEADER -->
    <header class="header-main">
        <div class="logo-text">Liverpool</div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="fields-card">
            <h2>Ingresa los siguientes datos</h2>
            <span class="required-note">*Campos obligatorios</span>

            <form action="#">
                <div class="form-group">
                    <input type="text" placeholder="Nombre(s)*" required>
                </div>

                <div class="form-group">
                    <input type="text" placeholder="Apellido Paterno*" required>
                </div>

                <div class="form-group">
                    <input type="text" placeholder="Apellido Materno">
                </div>

                <label class="dob-label">Fecha de Nacimiento</label>
                <div class="dob-group">
                    <select required>
                        <option value="" disabled selected>Día</option>
                        <!-- Se pueden agregar más opciones aquí -->
                        <option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option>
                    </select>
                    <select required>
                        <option value="" disabled selected>Mes</option>
                        <option>Enero</option><option>Febrero</option><option>Marzo</option><option>Abril</option><option>Mayo</option><option>Junio</option><option>Julio</option><option>Agosto</option><option>Septiembre</option><option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
                    </select>
                    <select id="AnioSelect" required>
                        <option value="" disabled selected>Año</option>
                    </select>
                </div>

                <label class="gender-label">Sexo:</label>
                <div class="gender-group">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="mujer"> Mujer
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="hombre"> Hombre
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="indefinido"> Indefinido
                    </label>
                </div>

                <p class="terms-text">
                    Al hacer click en Crear cuenta, estás aceptando nuestros 
                    <a href="#">Términos, Condiciones y Aviso de Privacidad</a> y el envío de nuestras promociones.
                </p>

                <button type="submit" class="btn-submit">Crear cuenta</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>

    <script>
        // Script para manejar la transición de entrada definida en tu estiloLiverpool.css
        window.onload = () => {
            document.body.classList.add('loaded');
        };
    </script>
    

</body>
</html>
