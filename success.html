<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<link rel="stylesheet" href="estiloLiverpool.css">
<link rel="stylesheet" href="css/success.css">
</head>

<body>

<!-- TOPBAR -->
<header class="topbar">
    <div>
        <span>Mi tienda</span>
    </div>

    <div>
        <div>Otros servicios | Mesa de regalos | Mi crédito</div>
    </div>
</header>

<!-- HEADER PRINCIPAL -->
<nav class="header">

    <a href="home.html" class="logo">Liverpool</a>

    <div class="btn-cat">
        <a href="search.html" class="Categorias_Link">
            Categorías >
        </a>
    </div>

    <div class="search">
        <input type="text" placeholder="Buscar productos...">
    </div>

    <div class="rightIcons">

        <span class="iconBtn">
            <a href="miCuenta.html" class="miCuentaLink">
                <img src="icons/user.svg">
            </a>
        </span>

        <!--<span class="iconBtn">
            <a href="miCuenta.html" class="miCuentaLink">
                <span class="accountLabel">Mi cuenta</span>
            </a>
        </span> -->

        <span class="iconBtn">
            <a href="miCuenta.html?tab=wishlist" class="miCuentaLink">
                <img src="icons/heart.svg">
            </a>
        </span>

        <span class="iconBtn">
            <a href="bolsa.html" class="miCuentaLink">
                <img src="icons/bag.svg">
            </a>
        </span>

        <span id="accessibilityBtn" class="iconBtn">
        <img src="icons/accessibility.svg">
        </span>

    </div>

</nav>

<div class="accessPanel" id="accessPanel">

    <h4>Accesibilidad</h4>

    <div class="accItem">
        <span>Modo oscuro</span>

        <label class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="accItem">
        <span>Letra grande</span>

        <label class="switch">
            <input type="checkbox" id="sizeFontToggle">
            <span class="slider"></span>
        </label>
    </div>

</div>

<div class="successPage">

    <div class="successCard">

        <!-- ICONO -->
        <div class="successIcon">
            ✓
        </div>

        <!-- TEXTO -->
        <h1>
            ¡Compra realizada!
        </h1>

        <p class="successText">
            Tu pedido fue procesado correctamente.
        </p>

        <!-- PEDIDO -->
        <div class="orderBox">

            <span>Número de pedido</span>

            <h2>#LVP482913</h2>

        </div>

        <!-- ENTREGA DINÁMICA -->
        <div id="deliveryResult"></div>

        <!-- PRODUCTO -->
        <div class="successProduct">

            <img src="imagenes/tenis.png">

            <div>

                <h3>
                    Nike Court Vision Low
                </h3>

                <p>
                    Color blanco · Cantidad: 1
                </p>

            </div>

            <strong>
                $1,303.20
            </strong>

        </div>

        <!-- TOTAL -->
        <div class="successTotal">

            <span>Total pagado</span>

            <strong>$1,303.20</strong>

        </div>

        <!-- BOTONES -->
        <div class="successButtons">

            <a href="home.html">
                <button class="checkoutBtn">
                    Volver al inicio
                </button>
            </a>

        </div>

    </div>

</div>

<script src="script.js"></script>
<script src="success.html"></script>

</body>
</html>
