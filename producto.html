<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto</title>
<link rel="stylesheet" href="estiloLiverpool.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div>🛍 Mi tienda</div>
    <div>Otros servicios &nbsp;&nbsp;&nbsp; Mesa de regalos &nbsp;&nbsp;&nbsp; Mi crédito</div>
</div>

<!-- HEADER -->
<div class="header">
    <div class="logo">Liverpool</div>

    <div class="btn-cat">
        Categorías >
    </div>

    <div class="search">
        <input type="text" placeholder="Search">
    </div>

    <div class="rightIcons">
        <span>Mi cuenta</span>
        <span>♡</span>
        <span>🛍</span>
        <span>👁</span>
    </div>
</div>

<!-- PRODUCTO -->
<div class="productPage">

    <h1 class="productTitle">Nombre del producto</h1>

    <div class="productLayout">

        <!-- IMAGEN -->
        <div class="productImage">
            <img src="imagenes/tenis.png">
        </div>

        <!-- INFO -->
        <div class="productInfo">

            <div class="stars">
                ★ ★ ★ ★
                <span class="stock">Ver disponibilidad en tienda</span>
            </div>

            <div class="priceBox">
                <span class="old">$1,629.00</span>
                <span class="new">$1,303.20</span>
            </div>

            <div class="shipping">
                🚚 Envío gratis a todo el país
            </div>

            <div class="qty">
                <label>Cantidad:</label>
                <div class="qtyBox">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="color">
                Color: Blanco ▼
            </div>

        </div>

    </div>
</div>

<div class="buySticky" id="buySticky">
    <div class="buyContent">

        <div class="buyButtons">
            <button class="btnPrimary">Agregar a la bolsa</button>
            <button class="btnSecondary">Comprar ahora</button>
        </div>
    </div>
</div>

<div id="reviews">
   reseñas aquí
</div>

<script src="script.js"></script>
</body>
</html>
